<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudikshya Online Business Card</title>
    <!-- External CSS connection -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="main-title">Sudikshya Bam</h1>
        <!-- Added Week 11 Dark Mode Toggle Button -->
        <button id="theme-toggle">☀️ Light Mode</button>
    </header>
    
    <main>
        <p class="alert-text"><strong>Notice:</strong> Welcome to my online business card!</p>

        <div class="card">
            <!-- Replaced SVG with a random image from the web -->
            <img src="https://picsum.photos/150/150" alt="sudikshya's profile photo" class="profile-photo" width="150" height="150">
            
            <h2>sudikshya</h2>
            <p>I am a very basic coding beginner exploring the world of web programming in stu.</p>
            <p>You can send me an email below.</p>
            
            <form action="mailto:sudikshya@example.com" method="post" enctype="text/plain">
                <label for="visitor-email">Email Address:</label>
                <input type="email" id="visitor-email" placeholder="example@stu.ac.kr" required>
                <button type="submit">Contact Me</button>
            </form>
        </div>

        <!-- Week 12 Step 1: Hobby List Container (Required) -->
        <section class="card">
            <h3>My Hobbies & Skills</h3>
            <div id="hobby-list"></div>
        </section>

        <!-- Week 12 & 13: Hobby Gallery Container -->
        <section class="card">
            <h3>Hobby Gallery</h3>
            <img id="gallery-img" src="https://picsum.photos/id/1015/300/200" alt="Hobby photo" style="max-width: 100%; height: auto; border-radius: 6px;">
            <p id="gallery-desc"></p>
            <br>
            <button id="next-btn">Next Photo</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 sudikshya bam</p>
    </footer>

    <!-- Week 10 Assignment JS Connection -->
    <script src="script.js"></script>
</body>
</html>
